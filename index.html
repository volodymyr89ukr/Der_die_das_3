<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artikel-Trainer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Artikel-Trainer</h1>
      <p>Вибери правильний артикль для слова:</p>

      <div id="question"></div>

      <div class="button-container">
        <button class="btn article-btn" data-article="der">der</button>
        <button class="btn article-btn" data-article="die">die</button>
        <button class="btn article-btn" data-article="das">das</button>
      </div>

      <div id="result"></div>

      <button class="btn" id="startBtn">Почати гру</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
